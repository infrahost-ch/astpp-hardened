# managed by astpp-debian13/install.sh
# FreeSWITCH loads its SIP profiles, ACLs and users from ASTPP (mod_xml_curl ->
# nginx -> php-fpm -> MariaDB) while starting, so those must be up first.
[Unit]
Wants=mariadb.service nginx.service php@PHP_VER@-fpm.service
After=network-online.target mariadb.service nginx.service php@PHP_VER@-fpm.service

[Service]
# FreeSWITCH starts as root and drops to the "freeswitch" user (-u/-g) BEFORE it
# writes /run/freeswitch/freeswitch.pid. A systemd managed RuntimeDirectory= is
# re-chowned to the unit user (root) before every Exec* command, so the pid file
# cannot be written ("Error starting system!"). Create the directory ourselves.
RuntimeDirectory=
# The packaged unit runs "chown -R freeswitch:freeswitch /var/lib/freeswitch ..."
# before every start, which would take the recordings away from ASTPP (www-data).
# Replace it: own the runtime dirs, keep recordings group-readable for www-data.
ExecStartPre=
ExecStartPre=+/bin/sh -c 'install -d -o freeswitch -g freeswitch -m 0750 /run/freeswitch; chown -R freeswitch:freeswitch /var/log/freeswitch /var/lib/freeswitch/db /var/lib/freeswitch/storage 2>/dev/null; chown freeswitch:www-data /var/lib/freeswitch/recordings && chmod 2770 /var/lib/freeswitch/recordings'
Restart=on-failure
RestartSec=5s
