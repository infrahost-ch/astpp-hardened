; FreeSWITCH xml_curl / json_cdr endpoint - managed by astpp-debian13/install.sh
[astpp-fs]
user = www-data
group = www-data
listen = @PHP_FS_SOCK@
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Every REGISTER, call setup and CDR hits this pool - keep enough workers warm.
pm = dynamic
pm.max_children = @PM_FS_MAX_CHILDREN@
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 2000

request_terminate_timeout = 60
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php

env[PATH] = /usr/local/bin:/usr/bin:/bin

php_admin_value[error_log] = /var/log/astpp/php_fs_errors.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[open_basedir] = /opt/ASTPP/freeswitch/fs/:/var/www/html/fs/:/var/lib/astpp/:/var/log/astpp/:/tmp/
