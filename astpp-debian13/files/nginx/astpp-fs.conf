# FreeSWITCH -> ASTPP integration (mod_xml_curl + mod_json_cdr)
# managed by astpp-debian13/install.sh - reachable from localhost only.
server {
    listen 127.0.0.1:8735;
    listen [::1]:8735;
    server_name localhost;
    server_tokens off;

    root /var/www/html/fs;

    access_log /var/log/nginx/fs_access.log;
    error_log  /var/log/nginx/fs_error.log;

    allow 127.0.0.1;
    allow ::1;
    deny all;

    client_max_body_size 10M;

    location ~ ^/(index|cdr)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:@PHP_FS_SOCK@;
        fastcgi_read_timeout 60;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 64 8k;
        fastcgi_busy_buffers_size 256k;
    }

    location / {
        return 404;
    }
}
