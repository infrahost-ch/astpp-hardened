# ASTPP web interface - managed by astpp-debian13/install.sh
# Placeholders (@...@) are replaced by the installer.

# Login limit only for requests that check a password, OTP or captcha. The ASTPP pages
# call /login/get_language_text/ and /login/customer_permission_list/ via AJAX dozens
# of times per page view - those must not count (an empty key is not limited).
map "$request_method $uri" $astpp_login_limit_key {
    default "";
    "~^POST /(login|signup)(/(login|index|check_otp|resend_otp|send_otp|signup_otp|otp_verification|check_captcha|forgotpassword|confirmpassword|successpassword|reset_password))?/?$" $binary_remote_addr;
    # "forgot password" is also routed without the /signup prefix (config/routes.php, audit M8)
    "~^POST /(forgotpassword|confirmpassword|otp_verification)/?$" $binary_remote_addr;
}
limit_req_zone $astpp_login_limit_key zone=astpp_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=astpp_general:10m rate=30r/s;
# Provisioning API /api/v1: rate limit per source address (keys and allowed addresses are
# checked by ASTPP itself).
limit_req_zone $binary_remote_addr zone=astpp_api:10m rate=10r/s;
# Content-Security-Policy reports (audit O4): browsers send them in bursts; at most 60 per minute
# and address are stored (application/csp_report.php), the rest is dropped with 429.
limit_req_zone $binary_remote_addr zone=astpp_csp:1m rate=60r/m;
limit_req_status 429;

# Requests for unknown host names / plain IP access are dropped. ASTPP uses the
# Host header for database lookups (multi-domain feature), so only the configured
# name(s) are passed to PHP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     @SSL_CERT@;
    ssl_certificate_key @SSL_KEY@;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name @FQDN@;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @FQDN@;
    server_tokens off;

    ssl_certificate     @SSL_CERT@;
    ssl_certificate_key @SSL_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:astpp_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/html/astpp;
    index index.php;
    client_max_body_size 20M;

    access_log /var/log/nginx/astpp_access.log;
    error_log  /var/log/nginx/astpp_error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Only the CodeIgniter front controller is ever executed by PHP.
    location = /index.php {
        limit_req zone=astpp_general burst=60 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO "";
        fastcgi_param HTTPS on;
        fastcgi_pass unix:@PHP_SOCK@;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 64 8k;
        fastcgi_busy_buffers_size 256k;
    }

    # Any other *.php (uploads, application/, system/, addons/ ...) is never run.
    location ~ \.php$ {
        return 404;
    }

    # Internal directories - never served directly.
    location ~ ^/(application|system|cron|database_backup|attachments|language|htaccess)(/|$) {
        deny all;
    }
    # Addon icons on the addons page (images only).
    location ~ ^/addons/[A-Za-z0-9_]+/[A-Za-z0-9_]+/static/images/[A-Za-z0-9_.-]+\.(png|jpe?g|gif|svg)$ {
        expires epoch;
        access_log off;
        try_files $uri =404;
    }
    # "invoices" and "addons" are directories AND ASTPP module routes
    # (/invoices/invoice_list/, /addons/addons_list/...): never serve files from
    # them, always hand the request to the front controller.
    location ~ ^/(invoices|addons)(/|$) {
        rewrite ^ /index.php last;
    }
    # Call recordings are only handed out by these actions (access checked in PHP);
    # their URLs end in ".wav" and would otherwise hit the static file rule below.
    location ~ ^/(reports/customerReport_recording_download|user/user_report_recording_download)/ {
        rewrite ^ /index.php last;
    }
    # Imported/exported rate and customer CSV files.
    location ^~ /assets/Rates_File/ {
        deny all;
    }
    location ~ /\. {
        deny all;
    }
    location ~* \.(sql|gz|tar|tgz|zip|csv|log|sh|po|mo|ini|conf|bak|old|orig|swp|txt|md)$ {
        deny all;
    }

    # Content-Security-Policy reports (audit O4): small JSON bodies, own rate limit, no access log.
    location ^~ /csp_report {
        limit_req zone=astpp_csp burst=30 nodelay;
        client_max_body_size 64k;
        access_log off;
        try_files $uri /index.php;
    }

    # Provisioning API: JSON only, small request bodies, own rate limit.
    location ^~ /api/ {
        limit_req zone=astpp_api burst=40 nodelay;
        client_max_body_size 1m;
        try_files $uri /index.php;
    }

    # Brute force protection for login / signup / password reset.
    location ~ ^/(login|signup|forgotpassword|confirmpassword|otp_verification)(/|$) {
        limit_req zone=astpp_auth burst=10 nodelay;
        try_files $uri /index.php;
    }

    # Third-party libraries: the path contains the version, so they can be cached long.
    location ^~ /assets/vendor/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    # Own static files and uploads: browsers revalidate them on every use (ETag /
    # Last-Modified, 304 if unchanged), so a deploy (logos, CSS, JS) is visible at once.
    location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|woff2?|ttf|eot|wav|mp3|map)$ {
        expires epoch;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php;
    }
}
