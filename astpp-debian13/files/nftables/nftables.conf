#!/usr/sbin/nft -f
# ASTPP / FreeSWITCH host firewall - managed by astpp-debian13/install.sh
#
# Only the table "inet astpp" is (re)created here, other tables - in particular
# fail2ban's "inet f2b-table" - survive a "systemctl reload nftables".

table inet astpp
delete table inet astpp

table inet astpp {
	set ssh_allow4 { type ipv4_addr; flags interval; @SSH_ALLOW4@ }
	set ssh_allow6 { type ipv6_addr; flags interval; @SSH_ALLOW6@ }
	set sip_allow4 { type ipv4_addr; flags interval; @SIP_ALLOW4@ }
	set sip_allow6 { type ipv6_addr; flags interval; @SIP_ALLOW6@ }

	# per source SIP packet rate (scanner / flood protection)
	set sip_rate4 { type ipv4_addr; size 65535; flags dynamic,timeout; timeout 1m; }
	set sip_rate6 { type ipv6_addr; size 65535; flags dynamic,timeout; timeout 1m; }

	chain input {
		type filter hook input priority filter; policy drop;

		ct state established,related accept
		ct state invalid drop
		iif "lo" accept

		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 20/second accept
		meta l4proto ipv6-icmp accept

		tcp dport @SSH_PORT@ ct state new jump ssh_in
		tcp dport { 80, 443 } accept

		udp dport @SIP_PORTS@ jump sip_in
		tcp dport @SIP_PORTS@ ct state new jump sip_in

		udp dport @RTP_START@-@RTP_END@ accept
	}

	chain ssh_in {
@SSH_RULES@
	}

	chain sip_in {
@SIP_RULES@
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
