# managed by astpp-debian13/install.sh
# nginx "combined" log format. A failed ASTPP login answers the POST with 200
# (login page shown again), a successful one with a 302 redirect. Requests that
# hit the nginx login rate limit are answered with 429 - only the endpoints that
# check a password, OTP or captcha count (same list as the nginx map); the AJAX
# helpers under /login/ (translations, permissions) are called dozens of times
# per page view and must never lead to a ban.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "POST /(?:login|login/login|login/index|signup/forgotpassword|signup/confirmpassword)/? HTTP/[0-9.]+" 200
            ^<HOST> - \S+ \[[^\]]+\] "POST /(?:login|signup)(?:/(?:login|index|check_otp|resend_otp|send_otp|signup_otp|otp_verification|check_captcha|forgotpassword|confirmpassword|successpassword))?/? HTTP/[0-9.]+" 429
ignoreregex =
datepattern = {^LN-BEG}%%d/%%b/%%Y:%%H:%%M:%%S %%z
