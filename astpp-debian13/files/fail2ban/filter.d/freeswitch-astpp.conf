# managed by astpp-debian13/install.sh
# FreeSWITCH log lines, e.g.
#   2026-10-08 12:00:00.123456 98.33% [WARNING] sofia_reg.c:1797 SIP auth failure (REGISTER) on sofia profile 'default' for [100@sip.example] from ip 192.0.2.10
#   2026-10-08 12:00:00.123456 98.33% [WARNING] sofia_reg.c:3201 Can't find user [100@sip.example] from 192.0.2.10
# "SIP auth challenge" lines are NOT matched - every legitimate call produces one.
[Definition]
failregex = ^.*\[WARNING\] sofia_reg\.c:\d+ SIP auth failure \((?:REGISTER|INVITE|SUBSCRIBE|MESSAGE)\) on sofia profile '[^']+' for \[[^\]]*\] from ip <HOST>\s*$
            ^.*\[WARNING\] sofia_reg\.c:\d+ Can't find user \[[^\]]*\] from <HOST>\s*$
ignoreregex =
datepattern = {^LN-BEG}%%Y-%%m-%%d %%H:%%M:%%S
