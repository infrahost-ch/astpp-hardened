# managed by astpp-debian13/install.sh
[DEFAULT]
banaction          = nftables-multiport
banaction_allports = nftables-allports
bantime            = 1h
bantime.increment  = true
bantime.maxtime    = 1w
findtime           = 10m
maxretry           = 5
ignoreip           = 127.0.0.1/8 ::1 @IGNORE_IPS@
destemail          = @ADMIN_EMAIL@
sender             = fail2ban@@FQDN@

[sshd]
enabled = true
port    = @SSH_PORT@
backend = systemd

# SIP registration / call authentication failures and unknown users
# (needs "log-auth-failures" = true in the ASTPP SIP profile, which is the default).
[freeswitch-astpp]
enabled  = true
filter   = freeswitch-astpp
logpath  = /var/log/freeswitch/freeswitch.log
backend  = auto
action   = %(banaction_allports)s
maxretry = 10
findtime = 5m
bantime  = 6h

# Web login brute force (failed logins re-render the login page with HTTP 200,
# nginx rate limiting answers with HTTP 429).
[astpp-login]
enabled  = true
filter   = astpp-login
logpath  = /var/log/nginx/astpp_access.log
backend  = auto
port     = http,https
maxretry = 10
findtime = 10m
